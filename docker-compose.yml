# Whole system with one command: docker compose up --build
# Web site: http://localhost:3001 (/fa, /en)   API + Swagger: http://localhost:8000/docs   MinIO console: http://localhost:9001
# Emails (Mailpit): http://localhost:8025
# With monitoring (Grafana http://localhost:3000, Prometheus http://localhost:9090):
#   docker compose --profile observability up --build
# Demo data with photos (optional, empty database only): docker compose run --rm migrate caravansara seed-demo
#   (photos again after a storage error: ... caravansara seed-demo --photos-only)
# Bulk data for measuring, in its own database caravansara_bulk: docker compose run --rm migrate caravansara seed-bulk
#   then: docker compose run --rm migrate caravansara measure-queries   (db/bulk/queries, specs/backend (003))
x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &app-env
    CARAVANSARA_DATABASE_URL: postgresql+asyncpg://caravansara:caravansara@db:5432/caravansara
    CARAVANSARA_JWT_SECRET: ${CARAVANSARA_JWT_SECRET:-dev-only-change-me-dev-only-change-me}
    CARAVANSARA_S3_ENDPOINT_URL: http://minio:9000
    CARAVANSARA_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
    CARAVANSARA_S3_ACCESS_KEY: caravansara
    CARAVANSARA_S3_SECRET_KEY: caravansara-secret
    CARAVANSARA_S3_BUCKET: caravansara-media
    CARAVANSARA_MEDIA_BASE_URL: http://localhost:9000/caravansara-media
    CARAVANSARA_SEED_DIR: /app/db
    # Traces go to Alloy. Without the observability profile nothing listens there and the
    # spans are dropped quietly; logs and /metrics work either way.
    CARAVANSARA_OTEL_ENDPOINT: ${CARAVANSARA_OTEL_ENDPOINT:-http://alloy:4318}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgis/postgis:16-3.4
    # pg_stat_statements keeps per-query statistics for the Grafana "costly queries" panel
    # (specs/backend (003)); it must be preloaded, so changing this needs a restart of db.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    # Docker gives /dev/shm 64 MB; parallel VACUUM of the bulk bookings failed with "could not resize
    # shared memory segment ... No space left on device", and big parallel hash joins use it too.
    shm_size: 256mb
    environment:
      POSTGRES_USER: caravansara
      POSTGRES_PASSWORD: caravansara
      POSTGRES_DB: caravansara
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U caravansara -d caravansara"]  # TCP: the init-time server is socket-only
      interval: 2s
      timeout: 3s
      retries: 30

  # MinIO stopped publishing images in 2025; this is the last pinned Bitnami build.
  # The code speaks only the S3 API, so another S3-compatible server is a config change.
  minio:
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: caravansara
      MINIO_ROOT_PASSWORD: caravansara-secret
      MINIO_PROMETHEUS_AUTH_TYPE: public  # lets Prometheus scrape without a token (development only)
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/bitnami/minio/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A mail catcher for development (feature 013): takes SMTP on 1025 and shows every email at :8025.
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports: ["8025:8025"]

  # Applies migrations, loads the catalog and creates the photo bucket, then exits.
  migrate:
    <<: *app
    command: sh -c "caravansara migrate && caravansara seed && caravansara init-storage --public-read"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  api:
    <<: *app
    ports: ["8000:8000"]
    environment:
      <<: *app-env
      # Trust X-Forwarded-For only from the web site's fixed address, so the login and sign-up rate limits
      # count each visitor by their own address (specs/005-frontend-guest, research R19). Anyone else, such
      # as a direct call to port 8000, is counted by their own connection.
      FORWARDED_ALLOW_IPS: ${CARAVANSARA_WEB_IP:-172.28.0.250}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    command: ["caravansara", "worker"]
    environment:
      <<: *app-env
      # Emails from the outbox (feature 013) go to Mailpit in development: nothing leaves this machine, and
      # every email shows at http://localhost:8025. Production sets a real SMTP server here.
      CARAVANSARA_SMTP_HOST: ${CARAVANSARA_SMTP_HOST:-mailpit}
      CARAVANSARA_SMTP_PORT: ${CARAVANSARA_SMTP_PORT:-1025}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:  # the worker has no API; its metrics port shows it is alive
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/metrics')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # The web site (specs/005-frontend-guest): Next.js on port 3001, because Grafana has 3000. The browser talks
  # only to it; it forwards /api/v1 to the api service (research R5). Its fixed address is the one the api
  # trusts for X-Forwarded-For (R19).
  web:
    build:
      context: frontend
      args:
        NEXT_PUBLIC_MEDIA_BASE_URL: http://localhost:9000/caravansara-media
        NEXT_PUBLIC_MAP_TILE_URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    environment:
      API_INTERNAL_URL: http://api:8000
      # The admin panel (feature 009) answers only on this host; browsers send *.localhost to this machine.
      # In production: the admin subdomain, never linked from the site. Empty: no admin panel at all.
      ADMIN_HOST: ${CARAVANSARA_ADMIN_HOST:-admin.localhost:3001}
    ports: ["3001:3001"]
    networks:
      default:
        ipv4_address: ${CARAVANSARA_WEB_IP:-172.28.0.250}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/fa').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- monitoring: docker compose --profile observability up ----------------------------
  # One collector (Alloy) for logs and traces, Loki for logs, Tempo for traces, Prometheus
  # for metrics and alerts, Grafana to see all three together. Configs in observability/.

  alloy:
    image: grafana/alloy:v1.10.1
    profiles: [observability]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro  # reads container logs
    depends_on: [loki, tempo]

  loki:
    image: grafana/loki:3.5.3
    profiles: [observability]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.8.2
    profiles: [observability]
    user: "0"  # writes to the tempo-data volume, which Docker creates owned by root
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [observability]
    command: ["--collector.stat_statements"]  # off by default; reads pg_stat_statements
    environment:
      DATA_SOURCE_NAME: postgresql://caravansara:caravansara@db:5432/caravansara?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-caravansara}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/caravansara.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]

volumes:
  db-data:
  minio-data:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:

# A fixed subnet, so the web service can have the fixed address the api trusts (research R19). If it clashes
# with a network on your machine or VPN, set CARAVANSARA_APP_SUBNET, CARAVANSARA_APP_IP_RANGE and CARAVANSARA_WEB_IP (inside the subnet,
# outside the range) and run `docker compose down` (never with -v: it deletes the data) and `up` again.
networks:
  default:
    ipam:
      config:
        - subnet: ${CARAVANSARA_APP_SUBNET:-172.28.0.0/24}
          # Docker hands out addresses only from the lower half, so the web site's fixed address in the
          # upper half (CARAVANSARA_WEB_IP, default .250) is never taken by another container.
          ip_range: ${CARAVANSARA_APP_IP_RANGE:-172.28.0.0/25}
