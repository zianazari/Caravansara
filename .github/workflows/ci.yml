name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check src tests migrations
          uv run ruff format --check src tests migrations
      - name: Types
        run: uv run mypy
      - name: Module boundaries
        run: uv run lint-imports
      # testcontainers starts PostgreSQL + PostGIS and MinIO on the runner's Docker.
      - name: Tests (coverage >= 90%)
        run: uv run pytest --cov --cov-report=term --cov-report=xml

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        working-directory: .
        run: docker build -f backend/Dockerfile -t caravansara:ci .
      - name: Build the web image
        working-directory: .
        run: docker build -f frontend/Dockerfile -t caravansara-web:ci frontend

  # The web site (specs/005-frontend-guest, research R15). The client is generated from backend/openapi.json,
  # so a contract change that breaks the site fails here, not in a browser (FR-033).
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: API client matches backend/openapi.json
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - name: Lint
        run: |
          npm run lint
          npm run format:check
      - name: Types
        run: npm run typecheck
      # The 90% gate covers src/lib and src/api, where the rules are (research R16).
      - name: Tests (coverage >= 90% for rules)
        run: npm run test -- --coverage
      - name: Build
        run: npm run build

  # The whole system as it is deployed (feature 014): the built images in docker compose, then every
  # Playwright test against it, the API ones and the pages in a real Chrome. Until now these ran only on a
  # developer's machine, so a change that broke only the browser could reach main. On a failure the HTML
  # report, the traces and the screenshots are kept for a week, so the cause is found without running it again.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Admin host name
        # The admin panel answers only on admin.localhost (ADMIN_HOST); Chrome knows *.localhost, Node may not.
        run: echo "127.0.0.1 admin.localhost" | sudo tee -a /etc/hosts
      - name: Start the stack
        working-directory: .
        run: docker compose -f docker-compose.yml -f e2e/compose.e2e.yml up -d --build --wait --wait-timeout 600
      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npx playwright test
      - name: Service logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs --no-color --tail 300 api worker web migrate
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # Monitoring config is code too: a broken rule or collector config would fail silently at run time.
  observability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: observability
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
      - name: Alert rule unit tests
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" -w /etc/prometheus --entrypoint promtool \
            prom/prometheus:v3.5.0 test rules alerts.test.yml
      - name: Alloy config
        run: docker run --rm -v "$PWD/alloy:/cfg:ro" grafana/alloy:v1.10.1 fmt /cfg/config.alloy > /dev/null
      - name: Compose file, with and without the profile
        working-directory: .
        run: |
          docker compose config -q
          docker compose --profile observability config -q
