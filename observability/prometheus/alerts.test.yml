# Unit tests for alerts.yml: promtool test rules alerts.test.yml
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: a missing worker fires WorkerDown after 2 minutes
    interval: 1m
    input_series:
      - series: 'up{job="api", instance="api:8000"}'
        values: "1x10"
    alert_rule_test:
      - eval_time: 1m
        alertname: WorkerDown
        exp_alerts: []
      - eval_time: 3m
        alertname: WorkerDown
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: The worker is not running, so unpaid holds stay locked and stays never complete.

  - name: a healthy worker does not fire
    interval: 1m
    input_series:
      - series: 'up{job="worker", instance="worker:9100"}'
        values: "1x10"
      - series: 'caravansara_worker_last_success_timestamp_seconds{job="worker", instance="worker:9100"}'
        values: "0+60x10"  # succeeds every minute
    alert_rule_test:
      - eval_time: 10m
        alertname: WorkerDown
        exp_alerts: []
      - eval_time: 10m
        alertname: WorkerStale
        exp_alerts: []

  - name: a worker that stops succeeding fires WorkerStale
    interval: 1m
    input_series:
      - series: 'caravansara_worker_last_success_timestamp_seconds{job="worker", instance="worker:9100"}'
        values: "0+60x5 300x10"  # last success at minute 5
    alert_rule_test:
      - eval_time: 11m
        alertname: WorkerStale
        exp_alerts: []
      - eval_time: 13m
        alertname: WorkerStale
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: "The worker's last successful run was 8m 0s ago."

  - name: just over 5% server errors fire HighErrorRate
    interval: 1m
    input_series:
      - series: 'caravansara_http_requests_total{method="GET", route="/api/v1/cities", status="200"}'
        values: "0+90x20"
      - series: 'caravansara_http_requests_total{method="GET", route="/api/v1/cities", status="500"}'
        values: "0+10x20"
      - series: 'caravansara_http_requests_total{method="GET", route="/api/v1/countries", status="200"}'
        values: "0+99x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: HighErrorRate
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: "5.025% of API requests fail with 5xx."
