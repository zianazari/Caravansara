# Prometheus scrapes the API, the worker, PostgreSQL (through postgres_exporter) and MinIO.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # DNS discovery finds every copy after `docker compose up --scale api=3`.
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000

  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
