# Overrides for the API tests: every test registers its own users, so the
# per-IP limits (10 registrations an hour by default) would stop the run.
#   docker compose -f docker-compose.yml -f e2e/compose.e2e.yml up -d --build
services:
  api:
    environment:
      CARAVANSARA_REGISTER_MAX_PER_IP: "100000"
      CARAVANSARA_LOGIN_MAX_PER_IP: "100000"
  # The review-result email (feature 013) is sent by the worker; every 5 s instead of every minute, so the
  # test does not wait a minute for it.
  worker:
    environment:
      CARAVANSARA_WORKER_INTERVAL_SECONDS: "5"
