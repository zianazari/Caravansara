forbidden_modules = ["caravansara.identity.models", "caravansara.identity.repository", "caravansara.identity.router", "caravansara.catalog.models", "caravansara.catalog.repository", "caravansara.catalog.router", "caravansara.listings.models", "caravansara.listings.repository", "caravansara.listings.router", "caravansara.bookings.models", "caravansara.bookings.repository", "caravansara.bookings.router", "caravansara.reviews.models", "caravansara.reviews.repository", "caravansara.reviews.router", "caravansara.jobs.models", "caravansara.jobs.repository", "caravansara.jobs.router"]

