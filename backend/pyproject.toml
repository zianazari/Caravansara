forbidden_modules = ["caravansara.identity.models", "caravansara.identity.repository", "caravansara.identity.router", "caravansara.catalog.models", "caravansara.catalog.repository", "caravansara.catalog.router", "caravansara.listings.models", "caravansara.listings.repository", "caravansara.listings.router", "caravansara.reviews.models", "caravansara.reviews.repository", "caravansara.reviews.router", "caravansara.search.models", "caravansara.search.repository", "caravansara.search.router", "caravansara.jobs.models", "caravansara.jobs.repository", "caravansara.jobs.router"]

