forbidden_modules = ["caravansara.identity", "caravansara.catalog", "caravansara.listings", "caravansara.bookings", "caravansara.reviews", "caravansara.search", "caravansara.jobs"]

[[tool.importlinter.contracts]]
name = "feature modules do not use devdata"
type = "forbidden"
